<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS ShopeeFood – ตารางเวร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f4f7; --surface:#ffffff; --ink:#1c2230; --muted:#667085; --line:#d3d6dd; --line-strong:#b9bec9;
  --brand:#073763; --brand-ink:#ffffff; --slate:#697c99; --info:#efefef; --cell:#ffffff; --today:#e6effc; --todayh:#f4b400;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12151c; --surface:#1a1e28; --ink:#e9ecf3; --muted:#98a1b3; --line:#343b4c; --line-strong:#47506a;
    --info:#2a2f3a; --cell:#1a1e28; --today:#1f3150; --brand:#0b4a85;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12151c; --surface:#1a1e28; --ink:#e9ecf3; --muted:#98a1b3; --line:#343b4c; --line-strong:#47506a;
  --info:#2a2f3a; --cell:#1a1e28; --today:#1f3150; --brand:#0b4a85;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:30}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink);padding:12px 16px 0}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1800px;margin:0 auto}
h1{font-size:18px;font-weight:700;margin:0}
.spacer{flex:1}
.search{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 12px;font:inherit;min-width:0;width:200px}
.search::placeholder{color:rgba(255,255,255,.8)}
.search:focus-visible,.tab:focus-visible,.chip:focus-visible,.iconbtn:focus-visible,.hidsel:focus-visible{outline:2px solid #fff;outline-offset:2px}
.iconbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.iconbtn[aria-pressed="true"]{background:#fff;color:var(--brand);font-weight:700}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1800px;margin:10px auto 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:transparent;border:0;color:rgba(255,255,255,.85);font:inherit;font-weight:500;padding:8px 16px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink);font-weight:700}
.tab.add{opacity:.9;border:1px dashed rgba(255,255,255,.6);border-radius:8px;margin:0 0 4px 6px;padding:4px 12px}
.hidsel{flex:0 0 auto;align-self:center;margin:0 0 4px 6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:8px;padding:5px 8px;font:inherit;font-size:13px;cursor:pointer}
.hidsel option{color:#1c2230;background:#fff}
.hidsel.on{background:var(--bg);color:var(--ink);font-weight:700}
main{max-width:1800px;margin:0 auto;padding:16px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar h2{margin:0;font-size:20px;font-weight:700;letter-spacing:.2px}
.hidtag{display:inline-block;font-size:11px;font-weight:500;padding:1px 8px;margin-left:8px;border-radius:999px;background:var(--info);color:var(--muted);vertical-align:middle}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;padding:3px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.mini{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;font-size:12px;border-radius:6px;padding:2px 8px;cursor:pointer}
.mini:hover{border-color:var(--brand);color:var(--brand)}
.mini.danger:hover{border-color:#b42318;color:#b42318}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 16px;align-items:center;font-size:12px;color:var(--muted)}
.legend .lg{display:inline-flex;align-items:center;gap:6px}
.legend .c{display:inline-flex;min-width:30px;height:20px;padding:0 6px;border:1px solid var(--line)}
.dayschip{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:20px;background:#ffff00;color:#000;font-weight:600;border:1px solid var(--line)}
section.grp{margin-bottom:26px}
.grp-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.grp-head h3{margin:0;font-size:15px;font-weight:700}
.grp-head h3 small{font-weight:400;color:var(--muted);margin-left:6px}
.scroll{overflow-x:auto;background:var(--cell);border:1px solid var(--line-strong)}
table.sch{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content;min-width:100%}
table.sch th,table.sch td{padding:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;height:24px;white-space:nowrap}
table.sch th:last-child,table.sch td:last-child{border-right:0}
th.hn{background:#073763;color:#fff;font-weight:700;border-color:#0d4a85}
th.hp{background:var(--cell);font-weight:700}
th.hd{background:var(--slate);color:#fff;font-weight:700;min-width:32px;line-height:1.15;border-color:#7d8fab}
th.hd.wk{font-size:12px}
th.hd.today{background:#3c78d8;color:#fff}
th.hx{font-weight:700;min-width:34px}
th.hx.f{background:#a5a5a5;color:#fce5cd}
th.hx.ph{background:#ea9999;color:#000}
th.hx.os{background:#697c99;color:#fff}
td.cnt{font-weight:700;background:var(--cell);min-width:34px}
table.sch tr.gap td{border:0!important;background:var(--cell);height:18px;padding:0 4px}
table.sch tr.gap2 td{height:14px}
table.sch tr.sep td{background:var(--bg);height:22px;padding:0;border:0!important;border-top:1px solid var(--line-strong)!important;border-bottom:1px solid var(--line-strong)!important;font-size:11px;color:var(--muted);text-align:center;font-weight:600}
table.sch tr.sep td.sl{background:var(--bg)}
table.sch td.lab{border:0!important;border-bottom:3px solid var(--cell)!important}
table.sch td.sh,table.sch td.tm{border:0!important;border-bottom:3px solid var(--cell)!important;border-left:3px solid var(--cell)!important}
body.fit th.hx,body.fit td.cnt{width:30px;min-width:0;font-size:11px}
.s1,.s2,.s3{position:sticky;z-index:3}
.s1{left:0;min-width:30px;width:30px;max-width:30px}
.s2{left:30px;min-width:150px;width:150px;max-width:150px;text-align:left!important}
.s3{left:180px;min-width:66px;width:66px;max-width:66px;border-right:1px solid var(--line-strong)!important}
thead .s1,thead .s2,thead .s3{z-index:4}
td.inf{background:var(--info);color:var(--ink)}
td.inf.b{font-weight:700}
td.nm{padding:0 6px!important}
.nmwrap{display:flex;align-items:center;gap:4px}
.nmt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pe{flex:0 0 auto;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0 2px;font-size:13px}
.pe:hover{color:var(--brand)}
td.d{min-width:32px;padding:0}
td.d.today{background:var(--today);border-left:1px solid #6fa8dc;border-right:1px solid #6fa8dc}
td.mrg{width:auto!important;max-width:none!important;min-width:0!important}
table.sch td{border-right-style:dotted;border-bottom-style:dotted}
table.sch td.lab,table.sch td.sh,table.sch td.tm{border-style:solid}
table.sch td.d.today{border-left-style:solid;border-right-style:solid}
.c{display:flex;align-items:center;justify-content:center;height:100%;min-height:23px;font-size:13px}
.c.plain{background:transparent;color:var(--ink)}
.c.f{background:#a5a5a5;color:#fce5cd}
.c.vac{background:#b3d28d;color:#000}
.c.sl{background:#fde5d9;color:#000}
.c.ot{background:#d9d2e9;color:#000}
.c.fm{background:#cfe2f3;color:#000}
.c.tn{background:#ff6d01;color:#000}
.c.bl{background:#34a853;color:#000}
.c.ph{background:#ea9999;color:#000}
.c.os{background:#697c99;color:#fff}
.c.blank{background:transparent}
tr.row{cursor:pointer}
tr.row.hide{display:none}
tr.row:hover td.inf{background:#e2e6ee}
:root[data-theme="dark"] tr.row:hover td.inf{background:#343b4c}
tr.row.sel td.inf{box-shadow:inset 0 0 0 9999px rgba(244,180,0,.28)}
tr.row.sel td.d{box-shadow:inset 0 2px 0 var(--todayh),inset 0 -2px 0 var(--todayh)}
td.lab{background:#073763;color:#fff;font-weight:700;border-color:#0d4a85}
td.sh{background:var(--slate);color:#fff;font-weight:700;border-color:#7d8fab}
td.hint{font-size:11px;color:var(--muted);text-align:left;padding:0 6px!important;border-bottom:0!important}
td.blk{background:var(--cell)}
tr.sum td.d{font-weight:600}
td.low{color:#b42318;font-weight:700}
tr.mon td.d{font-size:11.5px;font-weight:500;padding:0 2px}
td.tm{background:var(--slate);color:#fff;font-weight:700;font-size:12px;border-color:#7d8fab;padding:0 4px!important;overflow:visible;min-width:100px}
body.fit td.tm{font-size:11.5px;min-width:0}
body.editing .editable{cursor:pointer}
body.editing .editable:hover{outline:2px solid var(--brand);outline-offset:-2px}
body.editing tr.row{cursor:default}
.empty{padding:40px;text-align:center;color:var(--muted)}
.note{margin:0 0 14px;padding:9px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.note b{color:var(--ink)}
button.tab.sumtab{margin-left:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);border-radius:8px;margin-bottom:4px;padding:4px 12px}
button.tab.sumtab[aria-selected="true"]{background:var(--bg);color:var(--ink);font-weight:700}
table.sum{table-layout:fixed;width:2202px;min-width:0;font-size:13px}
table.sum th,table.sum td{height:24px;padding:0 6px;white-space:nowrap;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
table.sum th.sh1{background:#073763;color:#fff;font-weight:700;border-color:#0d4a85}
table.sum th.smo{background:var(--slate);color:#fff;font-weight:700;border-color:#7d8fab}
table.sum th.sv{background:#ff0000;color:#fff;font-weight:700;min-width:40px}
table.sum th.ss{background:#ffff00;color:#000;font-weight:700;min-width:40px}
table.sum th.so{background:#00ffff;color:#000;font-weight:700;min-width:40px}
table.sum .sname{position:sticky;left:0;z-index:3;min-width:170px;max-width:170px;text-align:left;overflow:hidden;text-overflow:ellipsis}
table.sum .snick{position:sticky;left:170px;z-index:3;min-width:84px;max-width:84px;border-right:1px solid var(--line-strong)}
table.sum thead .sname,table.sum thead .snick{z-index:4}
table.sum tr.t0 td{background:#fff2cc;color:#1c2230}
table.sum tr.t1 td{background:#d9ead3;color:#1c2230}
table.sum tr.t2 td{background:#cfe2f3;color:#1c2230}
table.sum tr td.tv{background:#f4cccc;font-weight:700}
table.sum tr td.tv.neg{color:#b42318}
table.sum tr td.ts{background:#fff2cc;font-weight:700}
table.sum tr td.to{background:#c9daf8;font-weight:700}
table.sum td.sb.editable{cursor:pointer;outline:1px dashed var(--brand);outline-offset:-2px}
table.sum tr.stot td{background:#073763;color:#fff;font-weight:700;border-color:#0d4a85}
.tsw{display:inline-block;width:14px;height:14px;border:1px solid var(--line-strong)}
.tsw.t0{background:#fff2cc}.tsw.t1{background:#d9ead3}.tsw.t2{background:#cfe2f3}

.lvp{margin-top:8px}
.lvp h3{font-size:16px;margin:22px 0 4px}
.lvp h4{font-size:13px;margin:12px 0 6px;color:var(--muted);font-weight:600}
.lv{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.lvm{font-weight:600}
.lvs{color:var(--muted);font-size:12.5px;flex:1;min-width:200px}
.lvempty{color:var(--muted);font-size:13px;padding:6px 2px}
.st{padding:1px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st.pending{background:#fff3c4;color:#6b4e00}
.st.approved{background:#b3d28d;color:#1e3a0f}
.st.rejected{background:#ea9999;color:#4a0f0f}
.st.cancelled{background:var(--info);color:var(--muted)}
.mini.ok{border-color:#2e7d32;color:#2e7d32}
.aplist{display:flex;flex-direction:column;gap:2px;margin-top:4px;font-size:13px;color:var(--muted)}
.aplist button{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
.aplist button:hover{border-color:var(--brand)}
.apsel{margin-top:4px;font-size:13px;color:var(--ink);font-weight:600}
.lvnote{font-size:12px;color:var(--muted);margin:2px 0 0!important}

tr.band td{background:#cfe2f3;color:#674ea7;font-weight:700;font-size:15px;height:26px;border:1px solid #6fa8dc!important;text-align:left}
tr.band td span{position:sticky;left:10px}
body.fit tr.band td{text-align:center}
body.fit tr.band td span{position:static}
:root[data-theme="dark"] tr.band td{background:#27385a;color:#c5b8f5}
footer{max-width:1800px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:12px}
/* fit-to-width mode */
body.fit table.sch{width:100%;min-width:0;table-layout:fixed}
body.fit .s1{min-width:0;width:26px;max-width:26px}
body.fit .s2{left:26px;min-width:0;width:128px;max-width:128px;font-size:12px}
body.fit .s3{left:154px;min-width:0;width:60px;max-width:60px;font-size:12px}
body.fit th.hn:not(.s1):not(.s2):not(.s3),body.fit td.inf:not(.s1):not(.s2):not(.s3){width:40px;min-width:0;font-size:11px;padding:0 1px}
body.fit th.hp{width:48px;min-width:0;font-size:11px}
body.fit th.hd,body.fit td.d{min-width:0;overflow:hidden}
body.fit th.hd{font-size:11px}
body.fit th.hd.wk{font-size:9px}
body.fit .c{font-size:11px}
body.fit tr.mon td.d{writing-mode:vertical-rl;font-size:10px;padding:3px 0;height:auto;line-height:1.1;text-align:left;vertical-align:top}
body.fit td.sh,body.fit td.lab{font-size:11px}
/* popover + dialogs */
.pop{position:fixed;z-index:50;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:12px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);width:244px}
.pop .ttl{font-size:12px;color:var(--muted);margin-bottom:8px}
.pop .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pop .grid button{border:0;border-radius:7px;padding:6px 0;font:inherit;font-weight:600;cursor:pointer}
.pop .grid button.plain{background:var(--cell);border:1px solid var(--line-strong)}
.pop .grid button:focus-visible,.pop input:focus-visible,.dlg button:focus-visible,.dlg input:focus-visible,.dlg select:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.pop .row{display:flex;gap:6px;margin-top:8px;align-items:center;font-size:12px}
.pop input[type=text]{flex:1;min-width:0;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);border-radius:7px;padding:5px 8px;font:inherit}
.pop label{display:flex;gap:5px;align-items:center;cursor:pointer}
dialog.dlg{border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);color:var(--ink);padding:18px;width:min(380px,92vw);font:inherit}
dialog.dlg::backdrop{background:rgba(10,14,25,.5)}
.dlg h4{margin:0 0 12px;font-size:16px}
.dlg .f{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;font-size:12px;color:var(--muted)}
.dlg input,.dlg select{border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.dlg .acts button{border-radius:8px;padding:7px 16px;font:inherit;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.dlg .acts button.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.dlg .acts button.bad{background:#b42318;border-color:#b42318;color:#fff;font-weight:600}
.dlg p{margin:0 0 4px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:60;max-width:90vw}
@media (max-width:700px){
  .search{width:100%;order:5}
  main{padding:12px 10px}
  .s1,.s2{position:static}
  .s3{left:0}
  body.fit .s1,body.fit .s2{position:static}
}
@media print{header.top,.legend,.chips,.search{display:none}body::before{display:none}.s1,.s2,.s3{position:static}}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div><h1>CS ShopeeFood – ตารางเวร</h1></div>
    <span class="badge" id="role"></span>
    <div class="spacer"></div>
    <input id="q" class="search" type="search" placeholder="ค้นหาชื่อ / ชื่อเล่น" aria-label="ค้นหาชื่อ">
    <button id="editBtn" class="iconbtn" type="button" aria-pressed="false" hidden>แก้ไขตาราง</button>
    <button id="theme" class="iconbtn" type="button" aria-label="สลับโหมดมืด/สว่าง">โหมดมืด</button>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="เลือกเดือน"></div>
</header>
<main>
  <div class="bar">
    <h2 id="mtitle"></h2>
    <div class="spacer"></div>
    <div class="chips" id="chips" role="group" aria-label="เลือกทีม"></div>
  </div>
  <div class="legend" id="legend"></div>
  <div id="content"></div>
</main>
<footer>คลิกที่ชื่อเพื่อไฮไลต์แถว · เลื่อนตารางไปทางซ้าย/ขวาเพื่อดูวันอื่น ๆ · ข้อมูล ณ วันที่สร้างไฟล์ (แบบดูอย่างเดียว)</footer>
<script>
const MONTH_TH=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const MONTH_SH=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const MONTH_EN=["January","February","March","April","May","June","July","August","September","October","November","December"];
const WD=["จ.","อ.","พ.","พฤ.","ศ.","ส.","อา."];
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function classify(raw){
  const v=String(raw||"").trim();
  if(!v) return {cls:"blank",label:""};
  const u=v.toUpperCase();
  if(u.includes("PH")) return {cls:"ph",label:(u==="PH"||u==="7.5PH")?"PH":v};
  if(u.includes("VAC")||u==="V") return {cls:"vac",label:/^vac$/i.test(v)?"Vac":v.replace(/vac/i,"Vac")};
  if(u.startsWith("SL")) return {cls:"sl",label:v};
  if(u==="F") return {cls:"f",label:"F"};
  if(u==="OT") return {cls:"ot",label:"OT"};
  if(u==="FM") return {cls:"fm",label:"FM"};
  if(u==="TN") return {cls:"tn",label:"TN"};
  if(u==="BL") return {cls:"bl",label:"BL"};

let pop=null;

function openPop(anchor,title,current,opts,onPick){
  closePop();
  const p=document.createElement("div");p.className="pop";
  let html=`<div class="ttl">${esc(title)}</div>`;
  if(opts.codes){
    html+=`<div class="grid">`+PALETTE.map(([c,cls])=>`<button type="button" class="c ${cls}" data-v="${c}" style="min-height:0">${c}</button>`).join("")+`</div>`;
    html+=`<div class="row"><label><input type="checkbox" id="popOt" ${/T$/i.test(current||"")&&/^\d/.test(current||"")?"checked":""}> ทำ OT (เติม T)</label></div>`;
  }
  if(opts.names&&opts.names.length){html+=`<div class="row"><select id="popSel" aria-label="เลือกชื่อเล่นในทีม" style="flex:1;min-width:0;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);border-radius:7px;padding:5px 8px;font:inherit"><option value="">เลือกชื่อเล่นในทีม…</option>${opts.names.map(n=>`<option value="${esc(n)}" ${n===current?"selected":""}>${esc(n)}</option>`).join("")}</select></div>`}
  html+=`<div class="row"><input type="text" id="popTxt" placeholder="${opts.codes?"พิมพ์รหัสเอง":"พิมพ์ชื่อ"}" value="${esc(current||"")}" aria-label="ค่าในช่อง"><button type="button" class="mini" id="popOk">ตกลง</button></div>`;
  html+=`<div class="row"><button type="button" class="mini danger" id="popClr">ล้างช่อง</button><button type="button" class="mini" id="popX" style="margin-left:auto">ปิด</button></div>`;
  p.innerHTML=html;document.body.appendChild(p);pop=p;
  const rc=anchor.getBoundingClientRect();
  const w=p.offsetWidth,h=p.offsetHeight;
  let x=Math.min(Math.max(8,rc.left+rc.width/2-w/2),innerWidth-w-8);
  let y=rc.bottom+6; if(y+h>innerHeight-8) y=Math.max(8,rc.top-h-6);
  p.style.left=x+"px";p.style.top=y+"px";
  const done=v=>{closePop();onPick(v)};
  p.querySelectorAll(".grid button").forEach(b=>b.addEventListener("click",()=>{
    let v=b.dataset.v; const ot=p.querySelector("#popOt").checked;
    if(ot&&/^\d+$/.test(v)) v+="T"; done(v);
  }));
  const txt=p.querySelector("#popTxt");
  p.querySelector("#popOk").addEventListener("click",()=>done(txt.value.trim()));
  txt.addEventListener("keydown",e=>{if(e.key==="Enter")done(txt.value.trim())});
  p.querySelector("#popClr").addEventListener("click",()=>done(""));
  p.querySelector("#popX").addEventListener("click",closePop);
  const ps=p.querySelector("#popSel");
  if(ps){ps.addEventListener("change",()=>{if(ps.value)done(ps.value)});ps.focus()}else{txt.focus();txt.select()}
}

function dialog(title,fields,okLabel,onOk,danger){

   `<div class="acts"><button type="button" id="dCancel">ยกเลิก</button><button type="button" id="dOk" class="${danger?"bad":"pri"}">${esc(okLabel)}</button></div>`;
  document.body.appendChild(d);d.showModal();
  const close=()=>{d.close();d.remove()};
  d.querySelector("#dCancel").addEventListener("click",close);
  d.addEventListener("cancel",e=>{e.preventDefault();close()});

const LV_TYPES=[["Vac","ลาพักร้อน (Vac)"],["SL","ลาป่วย (SL)"],["BL","ลากิจ (BL)"],["FM","Family Care (FM)"],["F","ขอวันหยุด (F)"]];
const APPROVERS=["peenithi.pra@shopee.com","jiranan.nob@shopee.com","first.jairak@shopee.com"];
async function resolveApprover(email){
  if(state.apprMap[email]!==undefined)return state.apprMap[email];
  let res=null;
  try{
    const mine=((await user.email())||"").toLowerCase();
    if(mine&&mine===email.toLowerCase()){res={id:state.uid,name:(await user.name())||"ฉัน"}}
    else{
      const hits=await user.search(email);
      const m=hits.find(x=>(x.email||"").toLowerCase()===email.toLowerCase())||(hits.length===1&&!hits[0].email?hits[0]:null);
      if(m)res={id:m.id,name:m.name};
    }
    if(res)state.profiles[res.id]=res.name;
  }catch(e){}
  state.apprMap[email]=res;
  return res;
}
const lvLabel=t=>(LV_TYPES.find(x=>x[0]===t)||[t,t])[1];
const lvIso=(y,m,d)=>`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const lvFmt=s=>{const [y,m,d]=String(s).split("-");return `${d}/${m}/${y}`};
function lvDays(from,to){const out=[];const a=new Date(from+"T00:00:00Z"),b=new Date(to+"T00:00:00Z");for(let t=a;t<=b&&out.length<62;t=new Date(t.getTime()+864e5)){out.push([t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate()])}return out}
function allReq(){const out=[];for(const [uid,items] of Object.entries(state.requests||{})){for(const it of Object.values(items||{})){if(!it||!it.rid)continue;out.push({...it,uid,dec:((state.decisions||{})[it.approverId]||{})[it.rid]||null})}}return out}
const lvStatus=x=>x.cancelled?"cancelled":(x.dec?x.dec.status:"pending");
const lvStText={pending:"รออนุมัติ",approved:"อนุมัติแล้ว",rejected:"ไม่อนุมัติ",cancelled:"ยกเลิกแล้ว"};
function pendingMe(){return state.uid?allReq().filter(x=>x.approverId===state.uid&&lvStatus(x)==="pending").length:0}
const nm=id=>state.profiles[id]||"…";
async function resolveNames(ids){
  const miss=[...new Set(ids)].filter(i=>i&&!(i in state.profiles));
  if(!miss.length||!user)return;
  miss.forEach(i=>{state.profiles[i]=""});
  try{const ps=await user.profiles(miss);for(const i of miss)state.profiles[i]=(ps[i]&&ps[i].name)||"ผู้ใช้"}catch(e){miss.forEach(i=>{state.profiles[i]="ผู้ใช้"})}
  render();
}
function lvWrite(path,body){
  return queue(async()=>{const ref=db.doc(path);try{await ref.update(body)}catch(e){if(e&&e.code==="invalid_argument"){await ref.set(body)}else throw e}});
}
function applyLeave(req){
  let ok=0,skip=0;
  for(const [y,m,d] of lvDays(req.from,req.to)){
    const k=`${y}-${String(m).padStart(2,"0")}`;
    const rr=state.rosters.find(r=>r.key===k);
    if(rr&&rr.groups.some(g=>g.people.some(p=>p.id===req.pid))){writeCell(k,req.pid,d,req.type);ok++}else skip++;
  }

}

/* ---------- leave / OT summary ---------- */
const SUMCOLS='<colgroup><col style="width:170px"><col style="width:84px"><col style="width:92px"><col style="width:92px"><col style="width:60px"><col style="width:60px"><col style="width:60px">'+'<col style="width:44px">'.repeat(36)+'</colgroup>';
const MON3=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function nickKey(n){return String(n||"").trim().toLowerCase().replace(/[^a-z0-9\u0e00-\u0e7f]+/g,"_")}
function amtOf(v,re){const m=String(v).match(re);return m&&m[1]?parseFloat(m[1]):1}
function monthStats(cells,ndays){
  let vac=0,sl=0,ot=0;
  for(let d=1;d<=ndays;d++){
    const v=String(cells[d]||"").trim();if(!v)continue;
    if(/vac/i.test(v)||/^v$/i.test(v))vac+=amtOf(v,/vac\s*(\d+(?:\.\d+)?)/i);
    else if(/^sl/i.test(v))sl+=amtOf(v,/^sl\s*(\d+(?:\.\d+)?)/i);
    else if(/^\d+t$/i.test(v)||/^ot$/i.test(v))ot+=1;
  }
  return {vac,sl,ot};
}
const f1=n=>(Math.round(n*10)/10).toFixed(1);
const fi=n=>Number.isInteger(Math.round(n*10)/10)?String(Math.round(n*10)/10):f1(n);
function summarize(Y){
  const rs=state.rosters.filter(r=>r.year===Y).sort((a,b)=>a.month-b.month);
  const people=[],idx={};
  [...rs].reverse().forEach(r=>r.groups.forEach((g,gi)=>g.people.forEach(p=>{
    const k=nickKey(p.nick);if(!k||idx[k]!==undefined)return;
    idx[k]=people.length;people.push({k,nick:p.nick,name:p.name||p.nick,gi,m:{}});
  })));
  people.sort((a,b)=>a.gi-b.gi);
  const pos={};people.forEach((p,i)=>pos[p.k]=i);
  rs.forEach(r=>{
    const sh=(state.allShifts[r.key]||{}).cells||{};
    r.groups.forEach(g=>g.people.forEach(p=>{const k=nickKey(p.nick);if(pos[k]===undefined)return;people[pos[k]].m[r.month]=monthStats(sh[p.id]||{},r.ndays)}));
  });
  return {rs,people};
}
function renderSummary(content){
  const years=[...new Set(state.rosters.map(r=>r.year))].sort();
  if(!years.length){content.innerHTML=`<div class="empty">ยังไม่มีข้อมูล</div>`;return}

  const {rs,people}=summarize(Y);
  const bal=state.balances[String(Y)]||{};
  const have={};rs.forEach(r=>have[r.month]=true);
  const editing=state.edit&&state.canRoster;
  const titles={};const last=rs[rs.length-1];if(last)last.groups.forEach((g,gi)=>titles[gi]=g.title);
  let head=`<thead><tr><th rowspan="3" class="sh1 sname">Agent name</th><th rowspan="3" class="sh1 snick">Nickname</th><th rowspan="3" class="sh1">Balance ${Y-1}</th><th rowspan="3" class="sh1">Balance ${Y}</th><th rowspan="2" class="sh1">Total</th><th rowspan="2" class="sh1">Total</th><th rowspan="2" class="sh1">Total</th><th colspan="36" class="sh1">Use</th></tr><tr>`+MON3.map(m=>`<th colspan="3" class="smo">${m}</th>`).join("")+`</tr><tr><th class="sv">VAC</th><th class="ss">SL</th><th class="so">OT</th>`+MON3.map(()=>`<th class="sv">VAC</th><th class="ss">SL</th><th class="so">OT</th>`).join("")+`</tr></thead>`;
  const tot={rem:0,sl:0,ot:0,m:{}};
  let body="";
  people.forEach(p=>{
    const b=bal[p.k]||{};
    const prev=typeof b.prev==="number"?b.prev:0,ent=typeof b.ent==="number"?b.ent:12;
    let uv=0,us=0,uo=0;
    const cells=MON3.map((_,i)=>{
      const mo=i+1,s=p.m[mo];
      if(!s)return `<td class="sm"></td><td class="sm"></td><td class="sm"></td>`;
      uv+=s.vac;us+=s.sl;uo+=s.ot;
      tot.m[mo]=tot.m[mo]||{v:0,s:0,o:0};tot.m[mo].v+=s.vac;tot.m[mo].s+=s.sl;tot.m[mo].o+=s.ot;
      return `<td class="sm">${f1(s.vac)}</td><td class="sm">${f1(s.sl)}</td><td class="sm">${f1(s.ot)}</td>`;
    }).join("");
    const rem=prev+ent-uv;
    tot.rem+=rem;tot.sl+=us;tot.ot+=uo;
    const ed=editing?" editable":"";
    body+=`<tr class="t${p.gi%3}"><td class="sname" title="${esc(titles[p.gi]||"")}">${esc(p.name)}</td><td class="snick">${esc(p.nick)}</td><td class="sb${ed}" data-k="${esc(p.k)}" data-f="prev">${f1(prev)}</td><td class="sb${ed}" data-k="${esc(p.k)}" data-f="ent">${f1(ent)}</td><td class="tv${rem<0?" neg":""}">${f1(rem)}</td><td class="ts">${fi(us)}</td><td class="to">${fi(uo)}</td>${cells}</tr>`;
  });
